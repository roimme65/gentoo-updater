name: Create Release Discussion
run-name: 💬 Release Discussion - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

jobs:
  create-discussion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write

    steps:
      - name: Create Discussion from Release Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          CATEGORY_NAME: Announcements
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          TITLE="Release $VERSION"

          echo "Creating discussion for: $VERSION"

          # Repository-ID, Kategorien und vorhandene Discussions in einer Abfrage
          INFO=$(gh api graphql \
            -f owner="$OWNER" -f name="$REPO_NAME" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                id
                discussionCategories(first: 25) { nodes { id name } }
                discussions(first: 50, orderBy: {field: CREATED_AT, direction: DESC}) { nodes { title url } }
              }
            }')

          REPO_ID=$(jq -r '.data.repository.id' <<< "$INFO")
          # Gewünschte Kategorie, sonst die erste vorhandene
          CAT_ID=$(jq -r --arg name "$CATEGORY_NAME" \
            '.data.repository.discussionCategories.nodes | (map(select(.name == $name))[0] // .[0]) | .id // empty' <<< "$INFO")
          EXISTING=$(jq -r --arg title "$TITLE" \
            '.data.repository.discussions.nodes[] | select(.title == $title) | .url' <<< "$INFO" | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "✓ Discussion existiert bereits: $EXISTING"
            exit 0
          fi

          if [ -z "$CAT_ID" ]; then
            echo "::error::Keine Discussion-Kategorie gefunden (Discussions aktiviert?)"
            exit 1
          fi

          BODY="Release Notes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"

          RESPONSE=$(gh api graphql \
            -f repositoryId="$REPO_ID" -f categoryId="$CAT_ID" -f title="$TITLE" -f body="$BODY" \
            -f query='mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body}) {
                discussion { url }
              }
            }')

          echo "✅ Discussion erstellt: $(jq -r '.data.createDiscussion.discussion.url' <<< "$RESPONSE")"
