name: Tests
run-name: 🧪 Tests - ${{ github.ref_name }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    name: Python ${{ matrix.python-version }} - Syntax & Smoke Test
    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = Mindestversion (argparse.BooleanOptionalAction)
        python-version: [ '3.9', '3.11', '3.12', '3.13' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: |
          python -m py_compile gentoo-updater.py
          python -m py_compile install.py
          python -m py_compile scripts/create-release.py
          echo "✓ Python ${{ matrix.python-version }} syntax valid"

      # Startet die Skripte wirklich (findet z.B. NameError/ImportError, die py_compile nicht sieht)
      - name: Smoke test
        run: |
          python gentoo-updater.py --help > /dev/null
          python gentoo-updater.py --help --lang en > /dev/null
          python gentoo-updater.py --version
          python gentoo-updater.py --author
          python install.py --version
          python scripts/create-release.py --help > /dev/null
          echo "✓ Smoke test passed"

      - name: Check version consistency
        run: |
          V1=$(grep -oP '^__version__ = "\K[0-9.]+' gentoo-updater.py)
          V2=$(grep -oP '^__version__ = "\K[0-9.]+' install.py)
          if [ "$V1" != "$V2" ]; then
            echo "❌ Version mismatch: gentoo-updater.py=$V1, install.py=$V2"
            exit 1
          fi
          echo "✓ Versions match: $V1"

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for TODO/FIXME
        run: |
          echo "Checking for TODO/FIXME comments..."
          grep -n "TODO\|FIXME" gentoo-updater.py || echo "✓ No TODO/FIXME found"

      - name: Verify shebang
        run: |
          if head -n 1 gentoo-updater.py | grep -q "^#!/usr/bin/env python3"; then
            echo "✓ Correct shebang found"
          else
            echo "❌ Invalid shebang"
            exit 1
          fi

      - name: Check file permissions
        run: |
          if [ -x gentoo-updater.py ]; then
            echo "✓ Script is executable"
          else
            echo "⚠ Script is not executable (will be fixed on install)"
          fi

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          REQUIRED_FILES=(
            "README.md"
            "CHANGELOG.md"
            "LICENSE"
            "SECURITY.md"
            "gentoo-updater.py"
            "install.py"
            "gentoo-updater.conf.example"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Check README completeness
        run: |
          SECTIONS=(
            "## Features"
            "## Installation"
            "## Usage"
            "## Changelog"
          )
          
          for section in "${SECTIONS[@]}"; do
            if grep -q "$section" README.md; then
              echo "✓ Found: $section"
            else
              echo "❌ Missing section: $section"
              exit 1
            fi
          done

  config-validation:
    name: Config File Validation
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate JSON config
        run: |
          python3 -m json.tool gentoo-updater.conf.example > /dev/null
          echo "✓ Config file is valid JSON"

      - name: Check required config keys
        run: |
          REQUIRED_KEYS=(
            "emerge_jobs"
            "emerge_load_average"
            "enable_backups"
            "backup_dir"
            "min_free_space_gb"
          )
          
          for key in "${REQUIRED_KEYS[@]}"; do
            if grep -q "\"$key\"" gentoo-updater.conf.example; then
              echo "✓ Config key exists: $key"
            else
              echo "❌ Missing config key: $key"
              exit 1
            fi
          done
